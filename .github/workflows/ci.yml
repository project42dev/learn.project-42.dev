name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, hcs]
    env:
      NEXT_PUBLIC_PROJECT42_API_ORIGIN: https://api.example.test
    steps:
      - name: Enforce public tracker boundary
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          PULL_REQUEST_BODY: ${{ github.event.pull_request.body }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          if ([string] $env:PULL_REQUEST_BODY -match '(?i)https://dev\.azure\.com/') {
            throw 'Public pull-request bodies cannot contain private Azure DevOps URLs.'
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm install
        env:
          # Mermaid generation reuses Playwright; Puppeteer's separate browser is unused.
          PUPPETEER_SKIP_DOWNLOAD: "true"
      # Playwright's headless Chromium launch uses the smaller headless shell.
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run check
      - name: Verify reusable unconfigured account rendering
        env:
          NEXT_PUBLIC_PROJECT42_API_ORIGIN: ""
        run: |
          npm run build
          node --test \
            --test-name-pattern="renders account, approval, and cross-device progress surfaces" \
            tests/rendered-html.test.mjs

  self-host-image:
    runs-on: [self-hosted, linux, x64, hcs]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build self-host Learn image
        run: docker build --tag project42-learn:test .
      - name: Start image
        run: docker run --detach --name project42-learn --publish 3000:8080 project42-learn:test
      - name: Verify health and account route
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/health; then break; fi
            test "$attempt" -lt 20
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:3000/account/ | grep -q "Account"
      - name: Capture diagnostics
        if: failure()
        run: docker logs project42-learn || true
      - name: Stop image
        if: always()
        run: docker rm --force project42-learn || true
