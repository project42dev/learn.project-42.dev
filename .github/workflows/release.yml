name: Signed release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate candidate without publishing
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Validate release candidate
        run: |
          npm ci
          npx playwright install --with-deps chromium --only-shell
          npm run release:validate
          npm run check
          npm audit --omit=dev --audit-level=critical
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

  release:
    name: Publish signed tag release
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Verify release source
        run: |
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
          npm ci
          npx playwright install --with-deps chromium --only-shell
          npm run release:validate
          npm run check
          npm audit --omit=dev --audit-level=critical
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - name: Build release archive
        run: |
          mkdir release
          tar -czf "release/project42-learn-${GITHUB_REF_NAME}.tgz" -C dist/pages .
          cp self-host/compatibility.json release/
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to GitHub Container Registry
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish OCI image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/project42-learn"
          version="${GITHUB_REF_NAME#v}"
          docker buildx build \
            --tag "${image}:${version}" \
            --tag "${image}:latest" \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file release/image-metadata.json \
            --push .
          digest="$(jq -r '."containerimage.digest"' release/image-metadata.json)"
          test "$digest" != "null"
          echo "PROJECT42_IMAGE=${image}@${digest}" >> "$GITHUB_ENV"
      - name: Create manifest and rehearse rollback
        run: |
          node scripts/release-governance.mjs manifest \
            --output release/release-manifest.json \
            --source "$GITHUB_SHA" \
            --tag "$GITHUB_REF_NAME" \
            --artifact "release/project42-learn-${GITHUB_REF_NAME}.tgz" \
            --artifact release/compatibility.json \
            --artifact release/image-metadata.json
          node scripts/release-governance.mjs rehearse \
            --manifest release/release-manifest.json \
            --output release/rehearsal-evidence.json
          (cd release && sha256sum *.tgz *.json > SHA256SUMS)
      - uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: |
            release/project42-learn-*.tgz
            release/*.json
            release/SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign release artifacts and image
        run: |
          cosign sign --yes "$PROJECT42_IMAGE"
          cosign sign-blob --yes \
            --bundle release/project42-learn.sigstore.json \
            "release/project42-learn-${GITHUB_REF_NAME}.tgz"
          cosign sign-blob --yes \
            --bundle release/compatibility.sigstore.json \
            release/compatibility.json
      - name: Publish GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --notes-file RELEASE_NOTES.md \
            --title "Project 42 Learn ${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
