name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_PROJECT42_API_ORIGIN: ${{ vars.NEXT_PUBLIC_PROJECT42_API_ORIGIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run check
      # AB#6851 AB#6227: /account and /admin moved to their own subdomains, so
      # the published learn.project-42.dev site serves redirect stubs for them.
      # This re-export is deliberately separate from the one npm run check
      # produced: that artifact is also what the self-host Learn image serves
      # (Dockerfile runs npm run pages:build), and a self-hosted deployment has
      # no account./admin.project-42.dev to redirect to. Only this publish opts
      # in. It reuses the build npm run check already made.
      - name: Re-export with the migrated routes retired
        run: npm run pages:export -- --retire-migrated-routes
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist/pages
      # AB#6851: publish /account and /admin to their own subdomains from the
      # same build `npm run check` already produced, instead of the one-off
      # manual export+push done when this pipeline was first stood up. Each
      # target repo's own dist/pages content is unchanged if nothing in that
      # route subtree changed, so this is a no-op push on most runs.
      - name: Publish account.project-42.dev and admin.project-42.dev
        if: github.ref == 'refs/heads/main'
        env:
          GH_APP_ID: ${{ secrets.SUBDOMAIN_PUBLISH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.SUBDOMAIN_PUBLISH_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          node scripts/export-github-pages.mjs --domain=account.project-42.dev --routes=/account --out=pages-account
          node scripts/export-github-pages.mjs --domain=admin.project-42.dev --routes=/admin --out=pages-admin

          # Reads the existing App private key only to mint a short-lived
          # installation token (standard GitHub App auth flow) - never writes,
          # rotates, or otherwise changes the key itself.
          token=$(node scripts/mint-github-app-token.mjs project42dev)

          publish() {
            local repo="$1" export_dir="$2"
            local work; work=$(mktemp -d)
            git clone --depth 1 "https://x-access-token:${token}@github.com/project42dev/${repo}.git" "$work"
            find "$work" -mindepth 1 -maxdepth 1 -not -name .git -not -name .github -exec rm -rf {} +
            cp -r "${export_dir}/." "$work/"
            cd "$work"
            git config user.name "project42dev-bot"
            git config user.email "actions@project-42.dev"
            git add -A
            if git diff --cached --quiet; then
              echo "No content change for ${repo}, skipping push."
            else
              git commit -m "chore(publish): sync from learn.project-42.dev@${GITHUB_SHA:0:12} AB#6851"
              git push origin main
            fi
            cd - >/dev/null
            rm -rf "$work"
          }

          publish account.project-42.dev dist/pages-account
          publish admin.project-42.dev dist/pages-admin

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        id: deployment
