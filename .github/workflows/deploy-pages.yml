name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_PROJECT42_API_ORIGIN: ${{ vars.NEXT_PUBLIC_PROJECT42_API_ORIGIN }}
      NEXT_PUBLIC_PROJECT42_OIDC_AUTHORITY: ${{ vars.NEXT_PUBLIC_PROJECT42_OIDC_AUTHORITY }}
      NEXT_PUBLIC_PROJECT42_OIDC_CLIENT_ID: ${{ vars.NEXT_PUBLIC_PROJECT42_OIDC_CLIENT_ID }}
      NEXT_PUBLIC_PROJECT42_OIDC_SCOPE: ${{ vars.NEXT_PUBLIC_PROJECT42_OIDC_SCOPE }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run check
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
